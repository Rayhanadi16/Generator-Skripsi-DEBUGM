# Pengaturan untuk versi web (dipakai banyak orang)
[server]
maxUploadSize = 20          # MB per file; draft dan gambar skripsi jarang lebih besar dari ini

# Matikan pengiriman statistik pemakaian anonim milik Streamlit
[browser]
gatherUsageStats = false

# Sembunyikan menu pengembang
[client]
toolbarMode = "minimal"

# Warna dasar; rincian tampilan ada di tampilan.py
[theme]
base = "light"
primaryColor = "#4A3AA7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F2F6"
textColor = "#1B1F2E"
